# Cross-platform conda environment (Linux, Windows, macOS).
#
# This only bootstraps a Python interpreter; all actual dependencies come
# from pyproject.toml via pip, so there is a single source of truth instead
# of two dependency lists that drift apart. The original environment.yml was
# a `conda env export` of a Linux machine (build-string-pinned, GCC
# toolchain, X11 libs, ...) and could not be solved on Windows or macOS.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate graphene-defect-detector
#   pip install -e ".[dev]"
name: graphene-defect-detector
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
